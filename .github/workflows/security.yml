name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.20.0"
  NPM_VERSION: "11.19.1"

jobs:
  codeql:
    name: CodeQL
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate immutable workflow dependencies
        run: python3 .github/scripts/validate_workflow_pins.py
      - name: Validate zero-alert security implementation
        run: |
          python3 -m py_compile .github/scripts/validate_codeql_sarif.py .github/scripts/validate_codeql_sarif_selfcheck.py .github/scripts/validate_security_stack.py
          python3 .github/scripts/validate_codeql_sarif_selfcheck.py
          python3 .github/scripts/validate_security_stack.py
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript,python,actions
          queries: security-extended
      - name: Analyze
        id: analyze-source
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          output: reports/security/codeql-source
      - name: Enforce zero CodeQL alerts
        env:
          SARIF_DIR: ${{ steps.analyze-source.outputs.sarif-output }}
        run: python3 .github/scripts/validate_codeql_sarif.py "$SARIF_DIR"
      - name: Upload CodeQL SARIF evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif-${{ github.run_id }}
          path: reports/security/codeql-source/
          if-no-files-found: error
          retention-days: 14

  npm-audit:
    name: npm audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node current LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Validate immutable workflow dependencies
        run: python3 .github/scripts/validate_workflow_pins.py
      - name: Pin and verify npm toolchain
        run: |
          npm install --global --ignore-scripts "npm@${NPM_VERSION}" --no-audit --no-fund
          test "$(npm --version)" = "$NPM_VERSION"
          test "$(node --version)" = "v${NODE_VERSION}"
      - name: Install locked dependency graph without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Assert vulnerable node-forge was removed (no ASAP crypto)
        run: |
          node .github/scripts/validate_asap_disabled.js
          node .github/scripts/validate_asap_disabled.selftest.js
      - name: Test governed npm advisory policy
        run: node .github/scripts/test_npm_audit_validator.js
      - name: Audit HIGH and CRITICAL npm advisories with governed exceptions
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p reports/security
          set +e
          npm audit --audit-level=high --json > reports/security/npm-audit.json
          audit_status=$?
          set -e
          node .github/scripts/validate_npm_audit.js \
            --audit reports/security/npm-audit.json \
            --exceptions .github/security/npm-audit-exceptions.json \
            --audit-status "$audit_status"
      - name: Upload npm audit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-audit-evidence-${{ github.run_id }}
          path: reports/security/
          if-no-files-found: error
          retention-days: 14

  trivy:
    name: Trivy repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate immutable workflow dependencies
        run: python3 .github/scripts/validate_workflow_pins.py
      - name: Verify inert node-forge lock replacement before vulnerability scan
        run: node .github/scripts/validate_asap_disabled.js --lock-only
      - name: Prepare evidence directory
        run: mkdir -p reports/security
      - name: Scan npm dev dependencies, configuration, and repository secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          trivy-config: trivy.yaml
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          list-all-pkgs: true
          format: json
          output: reports/security/trivy.json
          exit-code: "1"
      - name: Require attributed repository security evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report="reports/security/trivy.json"
          summary="reports/security/trivy-summary.md"
          if [[ ! -s "$report" ]]; then
            printf '### Repository security gate\n\nTrivy did not produce the required JSON report.\n' | tee "$summary" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          jq -e '(.SchemaVersion == 2) and (.Trivy.Version == "0.74.0")' "$report" >/dev/null
          npm_results=$(jq '[.Results[]? | select(.Class == "lang-pkgs" and .Type == "npm" and (.Target | endswith("package-lock.json")))] | length' "$report")
          [[ "$npm_results" -ge 1 ]] || { echo 'Trivy JSON does not attribute an npm package-lock result' >&2; exit 1; }
          package_count=$(jq '[.Results[]? | select(.Class == "lang-pkgs" and .Type == "npm" and (.Target | endswith("package-lock.json"))) | .Packages[]?] | length' "$report")
          [[ "$package_count" -ge 10 ]] || { echo "Trivy npm package graph is unexpectedly small: $package_count" >&2; exit 1; }
          for package_name in newman flatted handlebars lodash underscore; do
            jq -e --arg package_name "$package_name" '
              [.Results[]?
                | select(.Class == "lang-pkgs" and .Type == "npm" and (.Target | endswith("package-lock.json")))
                | .Packages[]?
                | select(.Name == $package_name)]
              | length > 0
            ' "$report" >/dev/null || {
              echo "Trivy npm evidence is missing governed package: $package_name" >&2
              exit 1
            }
          done
          vulnerabilities=$(jq '[.Results[]? | .Vulnerabilities[]?] | length' "$report")
          misconfigurations=$(jq '[.Results[]? | .Misconfigurations[]?] | length' "$report")
          secrets=$(jq '[.Results[]? | .Secrets[]?] | length' "$report")
          {
            echo '### Repository security gate'
            echo
            echo '| Signal | Findings |'
            echo '| --- | ---: |'
            echo "| Attributed npm lock packages | ${package_count} |"
            echo "| Fixed HIGH/CRITICAL vulnerabilities | ${vulnerabilities} |"
            echo "| HIGH/CRITICAL misconfigurations | ${misconfigurations} |"
            echo "| Gated secret findings | ${secrets} |"
            echo
            echo '- Scanner: Trivy v0.74.0'
            echo '- npm dev dependencies are explicitly included through the committed Trivy configuration.'
            echo '- The package-lock evidence must include Newman and governed transitive override packages; the node-forge registry package is replaced by a fail-closed local stub verified separately.'
            echo '- Missing or unattributed JSON evidence is itself a gate failure.'
          } | tee "$summary" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload repository security evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-repository-evidence-${{ github.run_id }}
          path: reports/security/
          if-no-files-found: error
          retention-days: 14

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Probe the actual pull-request Dependency Review comparison API
        id: dependency-graph
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo '::error::Missing immutable PR base/head SHAs for Dependency Review.'
            exit 1
          }
          response="$RUNNER_TEMP/dependency-review-comparison.json"
          if ! status="$(curl --silent --show-error --max-time 20 --retry 2 \
            --output "$response" --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/dependency-graph/compare/$BASE_SHA...$HEAD_SHA")"; then
            echo '::error::Dependency Review comparison API transport failed; refusing degraded success.'
            exit 1
          fi
          if [[ "$status" == 200 ]]; then
            jq -e 'type == "array"' "$response" >/dev/null || {
              echo '::error::Dependency Review comparison API returned malformed data.'
              exit 1
            }
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'Authenticated PR dependency comparison succeeded; run change-aware Dependency Review.'
          elif [[ "$status" == 403 || "$status" == 404 ]]; then
            message="$(jq -r 'if type == "object" then (.message // "unspecified") else "non-JSON API error" end' "$response" 2>/dev/null | tr '\n' ' ' | cut -c 1-200 || true)"
            if [[ "${message,,}" == *"rate limit"* || "${message,,}" == *"abuse detection"* ]]; then
              echo "::error::Dependency Review API rate-limited the request (HTTP $status); refusing false degraded status."
              exit 1
            fi
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub PR dependency comparison returned HTTP $status: $message. Change-aware Dependency Review is NOT operational. Independent repository vulnerability scans remain required but are not equivalent."
            {
              echo '### Dependency Review: confirmed degraded coverage'
              echo
              echo "- Exact PR dependency comparison: HTTP $status ($message)."
              echo '- GitHub Dependency Review action was not run. The required independent npm/Python/Maven/NuGet/image/Trivy gates remain unchanged, not equivalent to PR change review.'
              echo '- Enable/configure Dependency Graph and proper GitHub Actions token access in repository security settings to restore this control.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Unexpected Dependency Review API HTTP $status; refusing degraded success."
            exit 1
          fi
      - name: Review dependency changes
        if: steps.dependency-graph.outputs.available == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
      - name: Confirm independent fallback gates
        if: steps.dependency-graph.outputs.available != 'true'
        run: echo 'Dependency Review service unavailable; npm Audit and attributed Trivy dev-dependency scanning remain independent required controls.'

  security-gate:
    name: security-gate
    if: always()
    needs: [codeql, npm-audit, trivy, dependency-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Evaluate security jobs
        env:
          CODEQL_RESULT: ${{ needs.codeql.result }}
          NPM_AUDIT_RESULT: ${{ needs.npm-audit.result }}
          TRIVY_RESULT: ${{ needs.trivy.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          EVENT_NAME: ${{ github.event_name }}
          SAME_REPOSITORY_PR: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$NPM_AUDIT_RESULT" == "success" ]] || { echo "npm-audit=$NPM_AUDIT_RESULT"; exit 1; }
          [[ "$TRIVY_RESULT" == "success" ]] || { echo "trivy=$TRIVY_RESULT"; exit 1; }
          if [[ "$SAME_REPOSITORY_PR" == "true" ]]; then
            [[ "$CODEQL_RESULT" == "success" ]] || { echo "codeql=$CODEQL_RESULT"; exit 1; }
          else
            [[ "$CODEQL_RESULT" == "skipped" || "$CODEQL_RESULT" == "success" ]] || { echo "codeql=$CODEQL_RESULT"; exit 1; }
          fi
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            [[ "$DEPENDENCY_REVIEW_RESULT" == "success" ]] || { echo "dependency-review=$DEPENDENCY_REVIEW_RESULT"; exit 1; }
          else
            [[ "$DEPENDENCY_REVIEW_RESULT" == "skipped" || "$DEPENDENCY_REVIEW_RESULT" == "success" ]] || { echo "dependency-review=$DEPENDENCY_REVIEW_RESULT"; exit 1; }
          fi
          echo 'Required security jobs satisfied the aggregate policy.'

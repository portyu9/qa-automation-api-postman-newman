name: lock-refresh

on:
  push:
    branches:
      - audit/final-production-hardening
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: newman-lock-refresh
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/final-production-hardening
      - name: Set up Node current LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
      - name: Pin npm
        run: |
          npm install --global --ignore-scripts npm@11.19.1 --no-audit --no-fund
          test "$(npm --version)" = '11.19.1'
      - name: Regenerate package lock from audited overrides
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit regenerated lockfile
        run: |
          set -euo pipefail
          git diff --exit-code -- package.json || true
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json is already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Regenerate lockfile for audited Newman overrides'
          git push origin HEAD:audit/final-production-hardening

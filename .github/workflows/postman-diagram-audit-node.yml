name: postman-diagram-audit-node

on:
  push:
    branches: [docs/reference-quality-mermaid]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/reference-quality-mermaid
      - name: Add npm audit security node
        shell: python
        run: |
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          old = '    SAST[CodeQL] --> SG[Security / security-gate]\n    TRIVY[Trivy] --> SG\n    REVIEW[Dependency Review when available] --> SG\n'
          new = '    SAST[CodeQL] --> SG[Security / security-gate]\n    AUDIT[npm Audit advisory policy] --> SG\n    TRIVY[Trivy] --> SG\n    REVIEW[Dependency Review when available] --> SG\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one security-node block, found {text.count(old)}')
          text = text.replace(old, new)
          old_class = '    class CIG,EG,DG,SAST,TRIVY,REVIEW,SG gate;\n'
          new_class = '    class CIG,EG,DG,SAST,AUDIT,TRIVY,REVIEW,SG gate;\n'
          if text.count(old_class) != 1:
              raise SystemExit(f'expected one gate class block, found {text.count(old_class)}')
          path.write_text(text.replace(old_class, new_class), encoding='utf-8')
      - name: Commit README-only correction
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/postman-diagram-audit-node.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md .github/workflows/postman-diagram-audit-node.yml
          git diff --cached --check
          git commit -m 'docs: include npm audit in architecture diagram'
          git push origin HEAD:docs/reference-quality-mermaid

name: extended

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "collections/**"
      - "schemas/**"
      - "data/**"
      - "scripts/**"
      - "postman_environment.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/extended.yml"
  schedule:
    - cron: "11 8 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: newman-extended-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-data-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TEST_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-local
      REQUEST_TIMEOUT_MS: "3000"
      NEWMAN_ITERATION_DATA: data/posts.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run validate
      - name: Execute full data-driven collection against runner-owned local API
        run: npm test
      - name: Publish API observability summary
        if: always()
        run: |
          {
            echo '### Newman · deterministic data-driven contract'
            echo
            echo "- Run ID: \`${TEST_RUN_ID}\`"
            echo '- Target: repository-owned `127.0.0.1:4010` API fixture'
            echo '- Dataset: `data/posts.json`'
            echo "- Job status: \`${{ job.status }}\`"
            echo '- Evidence: JUnit + sanitized run manifest'
          } | tee reports/extended-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload extended evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: newman-local-data-evidence
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

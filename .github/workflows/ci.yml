name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postman-newman-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
  REQUEST_TIMEOUT_MS: "10000"

jobs:
  newman:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run validate
      - name: Execute collection
        run: npm test
      - name: Upload Newman reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: newman-reports
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

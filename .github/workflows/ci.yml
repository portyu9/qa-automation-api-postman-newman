name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postman-newman-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NPM_VERSION: "11.19.1"
  TEST_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
  REQUEST_TIMEOUT_MS: "10000"
  EXPECTED_TARGET_CLASS: local-fixture
  EXPECTED_NEWMAN_COLLECTION: collections/posts-api.postman_collection.json
  EXPECTED_NEWMAN_ENVIRONMENT: postman_environment.json
  EXPECTED_NEWMAN_ITERATION_DATA: "<none>"
  EXPECTED_NEWMAN_FOLDER: "<none>"
  EXPECTED_EXECUTION_PROFILE: posts-full
  MIN_NEWMAN_ITERATIONS: "1"
  MIN_NEWMAN_REQUESTS: "5"
  MIN_NEWMAN_ASSERTIONS: "19"

jobs:
  newman:
    name: newman · ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: "24.20.0"
            label: "Node 24 current LTS"
          - node: "22.23.2"
            label: "Node 22 maintenance LTS"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Validate immutable workflow dependencies
        run: python3 .github/scripts/validate_workflow_pins.py
      - name: Pin and verify npm toolchain
        run: |
          npm install --global --ignore-scripts "npm@${NPM_VERSION}" --no-audit --no-fund
          test "$(npm --version)" = "$NPM_VERSION"
          test "$(node --version)" = "v${{ matrix.node }}"
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate assets, runtime, fixture, and evidence policy
        run: npm run validate
      - name: Execute collection against runner-owned local API
        run: npm test
      - name: Validate governed semantic Newman evidence
        run: npm run evidence:check
      - name: Publish CI observability summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          NODE_VERSION: ${{ matrix.node }}
          NODE_LABEL: ${{ matrix.label }}
        run: |
          mkdir -p reports
          node - <<'NODE'
          const fs = require('node:fs');
          const payload = {
            schemaVersion: 1,
            framework: 'postman-newman',
            runId: process.env.TEST_RUN_ID,
            dimension: { node: process.env.NODE_VERSION, execution: 'collection', target: 'local-fixture' },
            qualityFloor: { iterations: 1, requests: 5, assertions: 19 },
            status: process.env.JOB_STATUS,
            sha: process.env.GITHUB_SHA,
            ref: process.env.GITHUB_REF,
          };
          fs.writeFileSync('reports/ci-observability.json', `${JSON.stringify(payload, null, 2)}\n`);
          NODE
          {
            echo "### Postman / Newman · ${NODE_LABEL}"
            echo
            echo "- Run ID: \`${TEST_RUN_ID}\`"
            echo "- Job status: \`${JOB_STATUS}\`"
            echo "- Runtime: \`Node ${NODE_VERSION}\` + \`npm ${NPM_VERSION}\`"
            echo '- Target: repository-owned `127.0.0.1:4010` API fixture'
            echo '- Evidence floor: `>=1` iteration, `>=5` requests, `>=19` assertions, zero pending/failed work, reconciled ledger/JUnit'
            echo '- Identity contract: governed collection/environment, no iteration file/folder override, exact five-request local execution topology'
            echo '- Evidence: JUnit + validated allowlisted run manifest + CI observability envelope'
          } | tee reports/ci-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Newman reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: newman-reports-node-${{ matrix.node }}-${{ github.run_id }}
          path: reports/
          if-no-files-found: error
          retention-days: 14

  ci-gate:
    name: ci-gate
    if: always()
    needs: [newman]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Evaluate required runtime matrix
        env:
          NEWMAN_RESULT: ${{ needs.newman.result }}
        run: |
          if [[ "$NEWMAN_RESULT" != "success" ]]; then
            echo "required Newman runtime matrix did not succeed: $NEWMAN_RESULT" >&2
            exit 1
          fi
          echo 'Node 24 current-LTS and Node 22 maintenance-LTS lanes succeeded.'

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postman-newman-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
  REQUEST_TIMEOUT_MS: "10000"

jobs:
  newman:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run validate
      - name: Execute collection against runner-owned local API
        run: npm test
      - name: Publish CI observability summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p reports
          node - <<'NODE'
          const fs = require('node:fs');
          const payload = {
            schemaVersion: 1,
            framework: 'postman-newman',
            runId: process.env.TEST_RUN_ID,
            dimension: { node: '22', execution: 'collection', target: 'local-fixture' },
            status: process.env.JOB_STATUS,
            sha: process.env.GITHUB_SHA,
            ref: process.env.GITHUB_REF,
          };
          fs.writeFileSync('reports/ci-observability.json', `${JSON.stringify(payload, null, 2)}\n`);
          NODE
          {
            echo '### Postman / Newman · collection gate'
            echo
            echo "- Run ID: \`${TEST_RUN_ID}\`"
            echo "- Job status: \`${JOB_STATUS}\`"
            echo '- Target: repository-owned `127.0.0.1:4010` API fixture'
            echo '- Evidence: JUnit + sanitized run manifest + CI observability envelope'
          } | tee reports/ci-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Newman reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: newman-reports
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

name: normalize-versionless-docs
on:
  push:
    branches: [chore/versionless-docs]
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Normalize Postman/Newman documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          files=[Path('README.md'),*sorted(Path('docs').rglob('*.md'))]
          techs=['Node.js','Node','npm','Postman','Newman','Postman Collection','JSON Schema','JavaScript','Trivy','CodeQL']
          exact={
            'Node.js 22 and 24':'supported Node.js runtimes','Node 22 and 24':'supported Node runtimes','Node.js 22/24':'supported Node.js runtimes','Node 22/24':'supported Node runtimes',
            'npm@11.19.1':'npm','npm 11.19.1':'npm',
            'Postman Collection v2.1':'the Newman-supported Postman Collection format','Collection v2.1':'the Newman-supported collection format',
            'Collection v3':'a newer collection format','v2.1 JSON':'the Newman-supported JSON format','v2.1':'the Newman-supported format','v3':'a newer collection format',
          }
          for path in files:
            text=path.read_text(encoding='utf-8')
            for a,b in exact.items(): text=text.replace(a,b)
            for tech in techs:
              text=re.sub(rf'(?i)\b{re.escape(tech)}\s+(?:\*\*|`)?v?\d+(?:\.\d+)*(?:\.x)?(?:\s+LTS)?(?:\*\*|`)?',tech,text)
            text=re.sub(r'(?i)\bnpm@\d+(?:\.\d+)*','npm',text)
            path.write_text(text,encoding='utf-8')

          validator=Path('.github/scripts/validate_readme.py')
          text=validator.read_text(encoding='utf-8')
          old='''    package = json.loads((ROOT / "package.json").read_text(encoding="utf-8"))\n    npm_version = package.get("packageManager", "").removeprefix("npm@")\n    if npm_version and f"npm {npm_version}" not in text:\n        fail(f"README must name packageManager npm {npm_version}", errors)\n'''
          new='''    package = json.loads((ROOT / "package.json").read_text(encoding="utf-8"))\n    if not str(package.get("packageManager", "")).startswith("npm@"):\n        fail("package.json must declare the repository-owned npm package manager", errors)\n    if "npm" not in text:\n        fail("README must document npm without duplicating its numeric version", errors)\n'''
          if old not in text: raise SystemExit('expected npm README version validator block not found')
          validator.write_text(text.replace(old,new),encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          names=r'(?:Node\.js|Node|npm|Postman|Newman|Postman Collection|JSON Schema|JavaScript|Trivy|CodeQL)'
          pats=[re.compile(rf'(?i)\b{names}\s+(?:\*\*|`)?v?\d+(?:\.\d+)*(?:\.x)?'),re.compile(r'(?i)\bnpm@\d'),re.compile(r'(?i)\bCollection\s+v\d'),re.compile(r'(?i)\bv\d+(?:\.\d+)*\s+(?:collection|JSON)')]
          bad=[]
          for p in [Path('README.md'),*sorted(Path('docs').rglob('*.md'))]:
            for n,l in enumerate(p.read_text(encoding='utf-8').splitlines(),1):
              if any(x.search(l) for x in pats): bad.append(f'{p}:{n}: {l}')
          if bad: print('\n'.join(bad)); raise SystemExit(1)
          PY
          python3 .github/scripts/validate_readme.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/doc-version-normalize.yml
          git add -A
          git diff --cached --check
          git commit -m "docs: make technology documentation versionless"
          git push origin HEAD

name: apply-npm-audit-policy

on:
  push:
    branches: [security/govern-faker-advisory]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/govern-faker-advisory
      - name: Replace npm advisory gate only
        shell: python
        run: |
          from pathlib import Path
          import re
          path = Path('.github/workflows/security.yml')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(r"      - name: Audit HIGH and CRITICAL npm advisories with JSON evidence\n.*?(?=      - name: Upload npm audit evidence\n)", re.S)
          matches = list(pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit(f'expected one npm audit gate block, found {len(matches)}')
          lines = [
              '      - name: Test governed npm advisory policy',
              '        run: node .github/scripts/test_npm_audit_validator.js',
              '      - name: Audit HIGH and CRITICAL npm advisories with governed exceptions',
              '        shell: bash',
              '        run: |',
              '          set -uo pipefail',
              '          mkdir -p reports/security',
              '          set +e',
              '          npm audit --audit-level=high --json > reports/security/npm-audit.json',
              '          audit_status=$?',
              '          set -e',
              '          node .github/scripts/validate_npm_audit.js \\',
              '            --audit reports/security/npm-audit.json \\',
              '            --exceptions .github/security/npm-audit-exceptions.json \\',
              '            --audit-status "$audit_status"',
          ]
          replacement = '\n'.join(lines) + '\n'
          path.write_text(pattern.sub(lambda _: replacement, text, count=1), encoding='utf-8')
      - name: Commit governed advisory policy
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-npm-audit-policy.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/security.yml .github/workflows/apply-npm-audit-policy.yml
          git diff --cached --check
          git commit -m 'security: enforce scoped npm advisory exceptions'
          git push origin HEAD:security/govern-faker-advisory

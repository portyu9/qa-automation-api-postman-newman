name: faker-lock-refresh

on:
  push:
    branches: [security/faker-10.5-compat]

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Pin npm
        run: npm install --global npm@11.19.1
      - name: Regenerate lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Install exact graph
        run: npm ci --ignore-scripts
      - name: Validate Faker compatibility
        run: node scripts/faker-compat.selftest.js
      - name: Upload generated lock
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: faker-10.5-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1

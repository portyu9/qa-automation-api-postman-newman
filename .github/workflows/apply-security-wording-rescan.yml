name: apply-security-wording-rescan

on:
  push:
    branches: [docs/security-wording-rescan]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/security-wording-rescan
      - name: Align README security wording with governed npm Audit
        shell: python
        run: |
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          replacements = [
            ('| Security | Source/dependency/configuration exposure | CodeQL + Trivy + Dependency Review when available | SAST + repository scan + dependency-diff evidence |', '| Security | Source/advisory/dependency/configuration exposure | CodeQL + governed npm Audit + Trivy + Dependency Review when available | SAST + advisory JSON + repository scan + dependency-diff evidence |'),
            ('Security and docs workflows remain independent failure domains. CodeQL covers source-level security analysis; Trivy covers repository dependency/configuration/secret findings; pull requests use Dependency Review when GitHub Dependency graph is available and record an explicit fallback otherwise. These findings are not collection flakiness.', 'Security and docs workflows remain independent failure domains. CodeQL covers source-level security analysis; governed npm Audit evaluates HIGH/CRITICAL advisory exposure with machine-validated temporary exceptions when required; Trivy covers repository dependency/configuration/secret findings; pull requests use Dependency Review when GitHub Dependency graph is available and record an explicit fallback otherwise. These findings are not collection flakiness.'),
            ('Dependabot, npm, lifecycle-script-disabled locked installation, deterministic fixture tests, CodeQL, Trivy, and Dependency Review address different supply-chain risks and should remain separate controls.', 'Dependabot, lifecycle-script-disabled locked installation, deterministic fixture tests, CodeQL, governed npm Audit, Trivy, and Dependency Review address different supply-chain risks and should remain separate controls.'),
          ]
          for old, new in replacements:
            if s.count(old) != 1:
              raise SystemExit(f'expected one security wording fragment: {old!r}')
            s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit README wording alignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md
          git diff --cached --check
          git commit -m 'docs: align security wording with governed npm Audit'
          git push origin HEAD:docs/security-wording-rescan
